<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">MoE Models from Scratch — cover illustration</title>
  <desc id="desc">Four tokens flow into a router which selects two of four experts, in the book's TikZ palette.</desc>

  <defs>
    <!-- Arrow marker (book deep blue) -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#141464"/>
    </marker>
    <!-- Arrow marker (muted gray) for non-selected routes -->
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A0A0B0"/>
    </marker>
    <!-- Arrow marker (active green) for selected routes -->
    <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5cb83a"/>
    </marker>
  </defs>

  <!-- Soft outer card -->
  <rect x="0" y="0" width="900" height="320" rx="14" fill="#fbfbfe"/>

  <!-- ─────────── Tokens (left column) ─────────── -->
  <g id="tokens" transform="translate(50,40)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#141464">N tokens</text>
    <!-- 4 token dots -->
    <circle cx="20" cy="40"  r="14" fill="#C060E0" stroke="#7a3aa0" stroke-width="1.5"/>
    <circle cx="20" cy="90"  r="14" fill="#C060E0" stroke="#7a3aa0" stroke-width="1.5"/>
    <circle cx="20" cy="140" r="14" fill="#C060E0" stroke="#7a3aa0" stroke-width="1.5"/>
    <circle cx="20" cy="190" r="14" fill="#C060E0" stroke="#7a3aa0" stroke-width="1.5"/>
    <text x="50" y="44"  font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5a5a6a">t₀</text>
    <text x="50" y="94"  font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5a5a6a">t₁</text>
    <text x="50" y="144" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5a5a6a">t₂</text>
    <text x="50" y="194" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5a5a6a">t₃</text>
    <text x="0" y="240" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7a7a8a" font-style="italic">shape (B, T, D)</text>
  </g>

  <!-- ─────────── Router (middle) ─────────── -->
  <g id="router" transform="translate(280,80)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#00A7C1" fill-opacity="0.16" stroke="#007a92" stroke-width="2"/>
    <text x="100" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#005266">Router</text>
    <text x="100" y="70" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#005266">s ∈ ℝ&#x207F;&#x2071;&#x1d40;&#xb;&#x1d49;</text>
    <text x="100" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#005266" font-style="italic">scores → top-K</text>
    <text x="100" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#005266">+ softmax over selected</text>
  </g>

  <!-- ─────────── Experts (right column) ─────────── -->
  <g id="experts" transform="translate(600,40)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#141464">E experts</text>

    <!-- Expert 0: not selected (muted purple) -->
    <rect x="0" y="20" width="200" height="36" rx="6" fill="#9050FF" fill-opacity="0.10" stroke="#9050FF" stroke-width="1.5"/>
    <text x="14" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5a3a8a">Expert 0</text>
    <text x="186" y="44" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#7a7a8a">W₁⁽⁰⁾, W₂⁽⁰⁾</text>

    <!-- Expert 1: SELECTED (active green) -->
    <rect x="0" y="65" width="200" height="36" rx="6" fill="#70D050" fill-opacity="0.28" stroke="#5cb83a" stroke-width="2"/>
    <text x="14" y="89" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2a6b1a">Expert 1</text>
    <text x="186" y="89" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#2a6b1a">W₁⁽¹⁾, W₂⁽¹⁾</text>

    <!-- Expert 2: SELECTED (active green) -->
    <rect x="0" y="110" width="200" height="36" rx="6" fill="#70D050" fill-opacity="0.28" stroke="#5cb83a" stroke-width="2"/>
    <text x="14" y="134" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2a6b1a">Expert 2</text>
    <text x="186" y="134" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#2a6b1a">W₁⁽²⁾, W₂⁽²⁾</text>

    <!-- Expert 3: not selected (muted purple) -->
    <rect x="0" y="155" width="200" height="36" rx="6" fill="#9050FF" fill-opacity="0.10" stroke="#9050FF" stroke-width="1.5"/>
    <text x="14" y="179" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5a3a8a">Expert 3</text>
    <text x="186" y="179" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" fill="#7a7a8a">W₁⁽³⁾, W₂⁽³⁾</text>

    <text x="0" y="220" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7a7a8a" font-style="italic">top-K = 2 active per token</text>
  </g>

  <!-- ─────────── Arrows: tokens → router ─────────── -->
  <g stroke="#141464" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)">
    <line x1="84" y1="80"  x2="278" y2="120"/>
    <line x1="84" y1="130" x2="278" y2="140"/>
    <line x1="84" y1="180" x2="278" y2="160"/>
    <line x1="84" y1="230" x2="278" y2="180"/>
  </g>

  <!-- ─────────── Arrows: router → experts ─────────── -->
  <!-- non-selected (muted) -->
  <g stroke="#A0A0B0" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow-muted)">
    <line x1="482" y1="130" x2="598" y2="78"/>
    <line x1="482" y1="170" x2="598" y2="213"/>
  </g>
  <!-- selected (active green) -->
  <g stroke="#5cb83a" stroke-width="2.2" fill="none" marker-end="url(#arrow-active)">
    <line x1="482" y1="140" x2="598" y2="123"/>
    <line x1="482" y1="160" x2="598" y2="168"/>
  </g>

  <!-- ─────────── Caption strip across the bottom ─────────── -->
  <g transform="translate(450,290)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#141464">
      <tspan font-weight="700">router bias</tspan>
      <tspan dx="6">affects expert selection only;</tspan>
      <tspan dx="6" font-weight="700">final combine weights</tspan>
      <tspan dx="6">use unbiased selected scores.</tspan>
    </text>
  </g>
</svg>
